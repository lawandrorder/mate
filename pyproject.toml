[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mate-agent"
version = "0.1.0"
description = "Starter shopping agent for Mate — your mate while you shop."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Mate" }]
keywords = ["mate", "shopping", "agent", "cashback", "sms"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
]
dependencies = []

[project.urls]
Homepage = "https://mate.fm/"
Repository = "https://github.com/YOUR-USERNAME/mate"
Issues = "https://github.com/YOUR-USERNAME/mate/issues"

[project.scripts]
mate = "mate.cli:main"

[tool.setuptools.packages.find]
include = ["mate*"]

[tool.setuptools.package-data]
mate = ["web/*"]
